// 双奖池0.5.0：开关、限制、次数与效果参数。名单在draw_priority_memberlist.cfg。
// 所有抽奖冷却：0无冷却，正数为秒，允许小数；只在实际抽奖后开始计时。

// 总开关 0=关闭 1=开启
draw_enable "1"

// 优先玩家开关安全门触发开关
draw_door_enable "1"

// 优先玩家引燃/引爆触发开关
draw_explosion_enable "1"

// 开门与关门分别累计，分别超过此次数抽奖，仅清对应计数
draw_door_limit "1"

// 每次优先抽奖给每位在线真人增加普通次数
draw_normal_grant_on_priority "1"

// 每章节每位真人初始普通次数，中途首次加入补领一次
draw_normal_grant_on_chapter "3"

// 普通个人冰冻秒数
draw_normal_freeze_duration "15"

// 优先冰冻炸弹造成的冰冻秒数
draw_priority_freeze_duration "15"

// 优先冰冻炸弹引爆倒计时秒数
draw_priority_freeze_bomb_countdown "8"

// 冰冻炸弹半径
draw_priority_freeze_bomb_radius "200"

// 定时炸弹倒计时秒数
draw_priority_time_bomb_countdown "8"

// 定时炸弹半径
draw_priority_time_bomb_radius "200"

// 定时炸弹中心伤害，距离越远越低
draw_priority_time_bomb_damage "99"

// 个人中毒持续秒数
draw_priority_drug_duration "30"

// 个人低重力倍率
draw_priority_moon_gravity "0.1"

// 个人低重力秒数
draw_priority_moon_duration "180"

// 个人高重力倍率，死亡或回合结束解除
draw_priority_heavy_gravity "3"

// 加血最小值
draw_priority_heal_min "1"

// 加血最大值
draw_priority_heal_max "99"

// 扣血最小值
draw_priority_hurt_min "1"

// 扣血最大值
draw_priority_hurt_max "99"

// 同一玩家同一物品类型触发间隔秒数，0=关闭
draw_explosion_cooldown "0"

// HUD展示排队间隔，0立即展示不排队；不限制抽奖，支持小数秒
draw_hud_seconds "0"

// 每人玩门抽奖冷却秒数，0无冷却，支持小数
draw_door_cooldown "0"

// 每人普通抽奖冷却秒数，0无冷却，支持小数
draw_normal_cooldown "0"

// 每人drawpro测试冷却秒数，0无冷却，支持小数
draw_test_cooldown "0"

// 触发诊断输出服务器日志，0关闭1开启
draw_debug "0"

// 向本人提示玩门计数及冷却原因
draw_door_progress "1"

// 引燃汽油桶提示与触发开关：0关闭，1开启
draw_trigger_gascan "1"

// 打爆白色大油桶提示与触发开关：0关闭，1开启
draw_trigger_fuelbarrel "1"

// 打爆煤气罐提示与触发开关：0关闭，1开启
draw_trigger_propane "1"

// 打爆氧气瓶提示与触发开关：0关闭，1开启
draw_trigger_oxygen "1"

// 引燃路障油桶提示与触发开关：0关闭，1开启
draw_trigger_barricade "1"

// 打爆汽油泵提示与触发开关：0关闭，1开启
draw_trigger_gaspump "1"

// 点燃烟花盒提示与触发开关：0关闭，1开启
draw_trigger_fireworks "1"

// 打爆爆炸大油桶提示与触发开关：0关闭，1开启
draw_trigger_oildrum "1"


// 打胶倒计时秒数，两奖池共用，支持小数
draw_jerk_countdown "5"

// 打胶完成本人扣除实血，0不扣；不足时死亡
draw_jerk_damage "20"

// 打胶范围半径，生还者喷吐与清除感染者均用此范围
draw_jerk_radius "500"

// 是否清除范围内普感、特感、Witch、Tank，0否1是
draw_jerk_kill_infected "1"

// 是否给范围内生还者Bo​​omer喷吐效果，包含本人和BOT
draw_jerk_bile_enable "1"

// 游客jerk off测试冷却秒数，0无冷却，支持小数
draw_jerk_test_cooldown "0"
